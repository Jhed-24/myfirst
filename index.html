<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshCart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Announcement Bar -->
    <div class="announcement-bar">
        Same-day delivery available • Free shipping on minimum orders
    </div>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">FreshCart</div>

        <div class="nav-links">
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
           <a href="contact.html">Contact</a>
            <a href="payment.html">Payment</a>
        </div>

        <div class="nav-icons">
            <span>🔍</span>
            <span>🛒</span>
        </div>

        <!-- Hamburger (Mobile) -->
        <div class="hamburger">☰</div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-overlay"></div>

        <div class="hero-content">
            <h1>Fresh Items Delivered Fast</h1>
            <p>Quality products straight to your doorstep</p>
            <button class="cta-button"><a href="products.html">Shop Now</a></button>
        </div>
    </section>

    <!-- Sample Content Section -->
    <section class="container">
        <h2 class="section-title">Featured Picks</h2>
        <p class="section-text">
            Carefully selected items curated for quality and freshness.
        </p>
    </section>

</body>
</html>
