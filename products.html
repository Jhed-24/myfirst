<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | FreshCart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Announcement Bar -->
    <div class="announcement-bar">
        Fresh picks available today • Order now
    </div>

    <!-- Navbar (same as home for UX consistency) -->
    <nav class="navbar">
        <div class="logo">FreshCart</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
           <a href="contact.html">Contact</a>
            <a href="payment.html">Payment</a>
        </div>

        <div class="nav-icons">
            <span>🔍</span>
            <span>🛒</span>
        </div>

        <div class="hamburger">☰</div>
    </nav>

    <!-- Page Header -->
    <section class="page-header">
        <h1>Our Products</h1>
        <p>Browse fresh and carefully selected items</p>
    </section>

    <!-- Products Grid -->
    <section class="products container">

        <div class="product-card">
            <div class="product-image"></div>
            <h3>Fresh Apples</h3>
            <p class="price">$4.99</p>
            <button class="btn-outline">Add to Cart</button>
        </div>

        <div class="product-card">
            <div class="product-image"></div>
            <h3>Organic Bananas</h3>
            <p class="price">$3.49</p>
            <button class="btn-outline">Add to Cart</button>
        </div>

        <div class="product-card">
            <div class="product-image"></div>
            <h3>Seasonal Oranges</h3>
            <p class="price">$5.25</p>
            <button class="btn-outline">Add to Cart</button>
        </div>

        <div class="product-card">
            <div class="product-image"></div>
            <h3>Mixed Fruit Box</h3>
            <p class="price">$12.99</p>
            <button class="btn-outline">Add to Cart</button>
        </div>

    </section>

</body>
</html>
