<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | FreshCart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Announcement Bar -->
    <div class="announcement-bar">
        Secure checkout • Fast delivery
    </div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">FreshCart</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
           <a href="contact.html">Contact</a>
            <a href="payment.html">Payment</a>

        </div>

        <div class="nav-icons">
            <span>🔍</span>
            <span>🛒</span>
        </div>

        <div class="hamburger">☰</div>
    </nav>

    <!-- Page Header -->
    <section class="page-header">
        <h1>Your Cart</h1>
        <p>Review your selected items</p>
    </section>

    <!-- Cart Layout -->
    <section class="cart container">

        <!-- Cart Items -->
        <div class="cart-items">

            <div class="cart-item">
                <div class="cart-image"></div>
                <div class="cart-details">
                    <h3>Fresh Apples</h3>
                    <p class="cart-price">$4.99</p>
                </div>
                <div class="cart-qty">Qty: 1</div>
            </div>

            <div class="cart-item">
                <div class="cart-image"></div>
                <div class="cart-details">
                    <h3>Organic Bananas</h3>
                    <p class="cart-price">$3.49</p>
                </div>
                <div class="cart-qty">Qty: 2</div>
            </div>

        </div>

        <!-- Cart Summary -->
        <div class="cart-summary">
            <h2>Order Summary</h2>

            <div class="summary-row">
                <span>Subtotal</span>
                <span>$11.97</span>
            </div>

            <div class="summary-row">
                <span>Delivery</span>
                <span>Free</span>
            </div>

            <div class="summary-total">
                <span>Total</span>
                <span>$11.97</span>
            </div>

            <button class="cta-button">Proceed to Checkout</button>
        </div>

    </section>

</body>
</html>
