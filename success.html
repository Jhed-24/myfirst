<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful | FreshCart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Announcement Bar -->
    <div class="announcement-bar">
        Payment completed successfully 🎉
    </div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">FreshCart</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="contact.html">Contact</a>
        </div>

        <div class="nav-icons">
            <span>🔍</span>
            <span>🛒</span>
        </div>

        <div class="hamburger">☰</div>
    </nav>

    <!-- SUCCESS HERO (INDEX-STYLE) -->
    <section class="hero success-hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1>Payment Successful</h1>
            <p>Your order has been placed successfully</p>
        </div>
    </section>

    <!-- SUCCESS CONTENT -->
    <section class="success container">
        <div class="success-card">
            <h2>Thank You for Your Order!</h2>
            <p>
                We have received your payment and are preparing your items
                for delivery.
            </p>

            <div class="success-actions">
                <a href="products.html" class="btn-outline">Continue Shopping</a>
                <a href="index.html" class="cta-button">Back to Home</a>
            </div>
        </div>
    </section>

</body>
</html>
